<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Importar Alumnos desde Google Sheets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Importación Masiva de Alumnos</h4>
                    </div>
                    <div class="card-body">
                        <p class="text-muted">
                            Sube un archivo en formato <strong>CSV</strong> exportado desde Google Sheets. 
                            El orden de las columnas debe ser: <code>Apellido, Nombre, DNI, Sexo, Fecha Nacimiento</code>.
                        </p>
                        
                        <form action="/importar_alumnos" method="POST" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="archivo_csv" class="form-label">Seleccionar archivo CSV</label>
                                <input class="form-control" type="file" id="archivo_csv" name="archivo_csv" accept=".csv" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Promentar e Importar Datos</button>
                        </form>
                        
                        <div class="mt-3 text-center">
                            <a href="/principal" class="btn btn-secondary btn-sm">Volver al Listado</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
