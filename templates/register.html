<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Sistema Escolar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">

    <!-- Mensaje de error flotante (Alerta de Bootstrap) -->
    {% if error %}
    <div class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <strong>⚠️ ¡Atención!</strong> {{ error }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endif %}

    <div class="card shadow p-4" style="width: 400px;">
        <h3 class="text-center mb-4">Registro de Usuario</h3>
        
        <form method="POST">
            <div class="mb-3">
                <label for="usuario" class="form-label">Nuevo Usuario:</label>
                <input type="text" class="form-control" id="usuario" name="usuario" required>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña:</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>

            <div class="mb-3">
                <label for="admin_code" class="form-label"><strong>Clave de Dirección / Secretaría:</strong></label>
                <input type="password" class="form-control" id="admin_code" name="admin_code" required placeholder="Clave institucional autorizada">
                <div class="form-text">Necesaria para validar tu alta en el sistema.</div>
            </div>
            
            <button type="submit" class="btn btn-success w-100 mb-3">Registrarse</button>
        </form>
        
        <div class="text-center" style="font-size: 0.9rem;">
            <a href="{{ url_for('login') }}" class="text-decoration-none">← Volver al Login</a>
        </div>
    </div>
    
<!-- Bootstrap JS Bundle (¡Este script hace funcionar el botón X, modales y alertas!) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
