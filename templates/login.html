<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Sistema Escolar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
    
    <!-- Mensaje de error flotante (Alerta de Bootstrap) -->
    {% if error %}
    <div class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <strong>⚠️ ¡Atención!</strong> {{ error }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endif %}

    <div class="card shadow p-4" style="width: 380px;">
        <h3 class="text-center mb-4">Sistema Escolar</h3>
        
        <form method="POST">
            <div class="mb-3">
                <label for="usuario" class="form-label">Usuario:</label>
                <input type="text" class="form-class form-control" id="usuario" name="usuario" required>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña:</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 mb-3">Ingresar</button>
        </form>

        <div class="text-center" style="font-size: 0.9rem;">
            <a href="{{ url_for('register') }}" class="text-decoration-none">Registrar nuevo usuario</a>
        </div>
    </div>

    <!-- Bootstrap JS Bundle (¡Este script hace funcionar el botón X, modales y alertas!) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
